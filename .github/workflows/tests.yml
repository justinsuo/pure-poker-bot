name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile adb.py hand_eval.py engine.py perception.py bot.py capture.py advisor.py output.py tools/calibrate.py tools/doctor.py tools/list_devices.py tools/calibrate_region.py
      - name: Run offline unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Run offline diagnostics
        run: python tools/doctor.py --offline
